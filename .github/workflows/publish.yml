name: publish to PyPI

# Publishes when a GitHub release is published (tag like v0.1.0).
# Uses PyPI "trusted publishing" (OIDC) -- no token stored in the repo.
# One-time setup on PyPI: project settings -> Publishing -> add GitHub
# publisher with owner "lmytime", repository "lated", workflow
# "publish.yml", environment "pypi".

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
